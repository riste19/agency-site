<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================================= -->
    <!-- SEO  —  [REPLACE] all values below with your real brand info  -->
    <!-- ============================================================= -->
    <title>Northbound Studio — Web Development Agency</title>
    <meta
      name="description"
      content="Northbound Studio designs and builds high-performance web applications, custom software, and websites that win customers and scale without breaking. Start a project today."
    />
    <link rel="canonical" href="https://your-domain.com/" />
    <meta name="theme-color" content="#1B3A2B" />
    <meta name="author" content="Northbound Studio" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Northbound Studio" />
    <meta property="og:title" content="Northbound Studio — Web Development Agency" />
    <meta
      property="og:description"
      content="High-performance web applications, custom software, and websites that win customers and scale without breaking."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:image" content="https://your-domain.com/og-image.svg" />
    <meta property="og:image:alt" content="Northbound Studio — Web Development Agency" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Northbound Studio — Web Development Agency" />
    <meta
      name="twitter:description"
      content="High-performance web applications, custom software, and websites that win customers and scale without breaking."
    />
    <meta name="twitter:image" content="https://your-domain.com/og-image.svg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts: Fraunces (display serif) + Hanken Grotesk (body grotesque).
         preconnect + display=swap keeps first paint fast. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: helps search engines understand the business -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Northbound Studio",
        "url": "https://your-domain.com/",
        "description": "Web development agency building web applications, custom software, and websites.",
        "email": "hello@northbound.studio",
        "sameAs": [
          "https://twitter.com/your-handle",
          "https://www.linkedin.com/company/your-company",
          "https://github.com/your-org"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
